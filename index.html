:root{
  --bg:#f8fbf8; --surface:#ffffff; --ink:#565c63; --muted:#6b7886; --line:#d9dfe5;
  --accent:#f08300; --accent-ink:#565c63; --accent-text:#b45f00; --danger:#b4412f;
  color-scheme: light;
}
*{box-sizing:border-box}
body{cursor:default;margin:0;background:var(--bg);color:var(--ink);font-size:14px;
  font-family:"Inter","Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:10px 16px 96px}
h1{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.14em;text-align:center;margin:0 0 14px}
#form{position:relative;display:grid;grid-template-columns:1fr auto;gap:6px 8px;margin-bottom:20px;padding:12px 14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
#form .row{display:contents}
#form input{padding:6px 10px;font-size:13px}
#form button.primary{padding:5px 12px}
#form{font-size:13px}
#form .row label{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:12px;color:var(--muted);min-width:0}
#form .row label:first-child{grid-column:1}
#form .side{grid-column:2;grid-row:1 / 3;display:flex;flex-direction:column;min-width:0}
#cal{height:24px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer}
#cal{border-top:0;border-top-left-radius:0;border-top-right-radius:0}
#form .side label .dtext{padding:5px 12px;border-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
#cal:hover{color:var(--ink)}
#cal .ic-clk,#form.routine #cal .ic-cal{display:none}
#form.routine #cal .ic-clk{display:block}
#form.routine #cal{color:var(--accent)}
input[type=text],input[type=url],input[type=date],input[type=time],textarea{padding:10px 12px;font:inherit;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;width:100%}
textarea{resize:none;overflow:hidden;display:block;line-height:1.4;max-height:9em}
input:focus,textarea:focus,button:focus-visible{outline:none;border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 9%,transparent)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:8px 14px}
button.primary{background:var(--surface);color:var(--ink);border-color:var(--accent);font-weight:600}
.err{grid-column:1 / -1;color:var(--danger);font-size:12px;min-height:0;margin:0}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
li{position:relative;display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
body.dragging,body.dragging *{cursor:grabbing!important}
li.dragging{z-index:5;box-shadow:0 8px 24px rgba(60,70,80,.18);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));cursor:grabbing;transition:none;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){li:not(.editing){-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
@media (max-width:640px){#list{touch-action:pan-y}}
#calview{touch-action:pan-y}
li.done{background:color-mix(in srgb,var(--surface) 55%,transparent)}
li input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:2px 0 0;flex:none;cursor:pointer;
  border:1.5px solid var(--muted);border-radius:50%;background:var(--surface)}
li input[type=checkbox]:hover{border-color:var(--accent)}
li input[type=checkbox]:checked{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 38%,transparent 42%),var(--surface)}
li .body{flex:1;min-width:0}
li{cursor:default}
li .t{word-break:break-word;cursor:default;white-space:pre-line}
li.done .t{color:color-mix(in srgb,var(--ink) 75%,transparent);text-decoration:line-through}
.meta{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.datebox{position:relative;display:block;width:100%}
.datebox .dtext{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--ink);font:inherit;line-height:normal;text-align:left;cursor:pointer;width:100%}
.datebox .dtext.empty{color:var(--muted)}
.datebox:focus-within .dtext{outline:none;border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 9%,transparent)}
.picker{position:fixed;z-index:20;width:260px;padding:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.picker .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600}

<script>
const KEY = "local-todo-v1";
let todos = [];
let editingId = null;
let editCommit = null; // 編集中のカードを保存する関数(保存できたら true を返す)
let renderCount = 0;
let current = "today"; // 下のバーで選んでいるグループ
const openLinks = new Set(); // リンクの蛇腹を開いているタスクのID

try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { todos = []; }
// 以前の形式(リンク1つ: link)を、複数対応の形式(links の配列)に移す
for (const t of todos) {
  if (!Array.isArray(t.links)) t.links = t.link ? [t.link] : [];
  delete t.link;
  if (t.done && !t.due && !t.doneAt) t.doneAt = Date.now();
}

const $ = (id) => document.getElementById(id);
// Safari は、変換の確定のEnterでも isComposing=false で keydown が来る(compositionend が先に来る)ので、直前の確定も変換中として扱う
let lastCompEnd = 0;
document.addEventListener("compositionend", () => { lastCompEnd = Date.now(); }, true);
const IME = (e) => e.isComposing || e.keyCode === 229 || Date.now() - lastCompEnd < 120;
const NL = (e, el) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !IME(e)) { e.preventDefault(); const a = el.selectionStart, b = el.selectionEnd; el.setRangeText("\n", a, b, "end"); el.dispatchEvent(new Event("input")); return true; } return false; };
const COARSE = () => matchMedia("(pointer:coarse)").matches;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} };

// リンクを検証して正規化する。空文字は ""、不正なら null を返す。
function normalizeLink(raw) {
  const v = (raw || "").trim();
  if (!v) return "";
  const withScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v) ? v : "https://" + v;
  try {
    const u = new URL(withScheme);
    return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
  } catch (e) { return null; }
}

// リンク欄の末尾がカンマのとき、クリック(やフォーカス)でカーソルを必ず末尾(カンマの後ろ)に置く。
// 末尾にあることが分かるよう、そこにオレンジの点滅するブロックを出す。
// 欄がまだ画面に置かれていなければ、包んだ要素を返す(呼び出し側が置く)。
const measureCtx = document.createElement("canvas").getContext("2d");
function keepCaretAfterComma(input) {
  const wrap = document.createElement("span");
  wrap.className = "cwrap";
  const mark = document.createElement("span");
  mark.className = "endcaret";
  mark.hidden = true;
  if (input.parentNode) input.parentNode.replaceChild(wrap, input);
  wrap.append(input, mark);

  const endsWithComma = () => /[,，、]\s*$/.test(input.value);
  const toEnd = (force) => {
    if (!endsWithComma()) return;
    if (!force && input.selectionStart !== input.selectionEnd) return; // 文字を選択しているときは動かさない
    const n = input.value.length;
    input.setSelectionRange(n, n);
  };
  const update = () => {
    const atEnd = document.activeElement === input && endsWithComma() &&
      input.selectionStart === input.selectionEnd && input.selectionStart === input.value.length;
    if (!atEnd) { mark.hidden = true; return; }
    const cs = getComputedStyle(input);
    measureCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const w = measureCtx.measureText(input.value).width;
    const x = parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth) + w - input.scrollLeft;
    mark.style.left = Math.min(x, input.offsetWidth - 14) + "px";
    mark.hidden = false;
  };
  input.addEventListener("click", () => { toEnd(false); update(); });
  input.addEventListener("focus", () => setTimeout(() => { toEnd(true); update(); }, 0));
  for (const ev of ["input", "keyup", "mouseup", "scroll", "blur"]) input.addEventListener(ev, update);
  return wrap;
}

// カンマ(, ， 、)区切りのリンクを最大5つまで読み取る。{links} か {error} を返す。
const MAX_LINKS = 5;
function parseLinks(raw) {
  const parts = (raw || "").split(/[,，、]/).map(x => x.trim()).filter(Boolean);
  if (parts.length > MAX_LINKS) return { error: `リンクは${MAX_LINKS}個までです。` };
  const links = [];
  for (const x of parts) {
    const n = normalizeLink(x);
    if (n === null) return { error: "リンクは http または https のURLを入力してください。" };
    if (!links.includes(n)) links.push(n);
  }
  return { links };
}

// 日付だけを扱う(以前保存した「日付+時刻」の値も先頭10文字だけ使う)
function dueDate(s) {
  const d = new Date((s || "").slice(0, 10) + "T00:00:00");
  return isNaN(d) ? null : d;
}

// 今日の日付を YYYY-MM-DD(ローカル時間)で返す
function todayStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function fmtDue(s) {
  const d = dueDate(s);
  if (!d) return "";
  const md = `${d.getMonth() + 1}/${d.getDate()}`;
  return d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}/${md}`;
}

function weekdayOf(s) {
  const d = dueDate(s);
  return d ? "日月火水木金土"[d.getDay()] : "";
}

// ---- 日付ピッカー(自作カレンダー) ----
let pickerEl = null, pickerOff = null, pickerFor = null;

function closePicker() {
  if (pickerOff) { pickerOff(); pickerOff = null; }
  if (pickerEl) { pickerEl.remove(); pickerEl = null; }
  pickerFor = null;
}

function openPicker(input, anchor) {
  closePicker();
  pickerFor = input;
  const pad = (n) => String(n).padStart(2, "0");
  const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const now = new Date();
  const todayKey = key(now);
  const sel = dueDate(input.value);
  let vy = (sel || now).getFullYear(), vm = (sel || now).getMonth();

  const el = document.createElement("div");
  el.className = "picker";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-label", "日付を選ぶ");

  const commit = (v) => {
    input.value = v;
    input.dispatchEvent(new Event("change"));
    closePicker();
    anchor.focus();
  };
  const mk = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    if (tag === "button") e.type = "button";
    return e;
  };

  const draw = () => {
    el.innerHTML = "";
    const head = mk("div", "ph");
    const prev = mk("button", "", "‹"); prev.setAttribute("aria-label", "前の月");
    const next = mk("button", "", "›"); next.setAttribute("aria-label", "次の月");
    prev.onclick = () => { vm--; if (vm < 0) { vm = 11; vy--; } draw(); };
    next.onclick = () => { vm++; if (vm > 11) { vm = 0; vy++; } draw(); };
    head.append(prev, mk("span", "", `${vy}年${vm + 1}月`), next);

    const grid = mk("div", "pg");
    for (const w of "日月火水木金土") grid.appendChild(mk("span", "pw", w));
    const offset = new Date(vy, vm, 1).getDay();
    const selKey = input.value.slice(0, 10);
    for (let n = 0; n < 42; n++) {
      const d = new Date(vy, vm, 1 - offset + n);
      const k = key(d);
      const b = mk("button", "pd", String(d.getDate()));
      if (d.getMonth() !== vm) b.classList.add("out");
      if (k === todayKey) b.classList.add("today");
      if (k === selKey) b.classList.add("sel");
      b.onclick = () => commit(k);
      grid.appendChild(b);
    }

    const foot = mk("div", "pf");
    const bt = mk("button", "", "今日"); bt.onclick = () => commit(todayKey);
    const bc = mk("button", "", "クリア"); bc.onclick = () => commit("");
    foot.append(bt, bc);
    el.append(head, grid, foot);
  };
  draw();

  document.body.appendChild(el);
  pickerEl = el;
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  el.style.top = top + "px";
  el.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";

  const onDoc = (e) => { if (!el.contains(e.target) && !anchor.contains(e.target)) closePicker(); };
  const onKey = (e) => { if (e.key === "Escape") { closePicker(); anchor.focus(); } };
  document.addEventListener("mousedown", onDoc);
  document.addEventListener("keydown", onKey);
  window.addEventListener("resize", closePicker);
  window.addEventListener("scroll", closePicker, true);
  pickerOff = () => {
    document.removeEventListener("mousedown", onDoc);
    document.removeEventListener("keydown", onKey);
    window.removeEventListener("resize", closePicker);
    window.removeEventListener("scroll", closePicker, true);
  };
}

// 日付入力を「11/17」表示のボタンにして、押すとカレンダーを開く。値は隠した input に持つ。
function dateField(input) {
  const v = input.value;
  input.type = "hidden";
  input.value = v;
  const wrap = document.createElement("span");
  wrap.className = "datebox";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "dtext";
  btn.setAttribute("aria-label", "日付を選ぶ");
  const sync = () => {
    const d = dueDate(input.value);
    btn.textContent = d ? `${d.getMonth() + 1}/${d.getDate()}` : "日付なし";
    btn.classList.toggle("empty", !d);
  };
  input.addEventListener("change", sync);
  btn.onclick = () => { if (pickerFor === input) closePicker(); else openPicker(input, btn); };
  if (input.parentNode) input.parentNode.replaceChild(wrap, input);
  wrap.append(btn, input);
  input._sync = sync;
  sync();
  return wrap;
}


// ルーティーンの時間を選ぶ画面。カレンダーと同じ見た目の小さなポップアップ(時 → 分の順に選ぶ)
function openTimePicker(input, anchor) {
  closePicker();
  pickerFor = input;
  const pad = (n) => String(n).padStart(2, "0");
  const m = /^(\d{2}):(\d{2})$/.exec(input.value);
  let hh = m ? +m[1] : 7, mm = m ? +m[2] : 0;
  const el = document.createElement("div");
  el.className = "picker tpicker";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-label", "時間を選ぶ");
  const mk = (cls, text) => { const b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = text; return b; };
  const label = (text) => { const s = document.createElement("div"); s.className = "tl"; s.textContent = text; return s; };
  const commit = () => {
    input.value = `${pad(hh)}:${pad(mm)}`;
    input.dispatchEvent(new Event("change"));
    closePicker();
    anchor.focus();
  };
  const draw = () => {
    const keep = [...el.querySelectorAll(".tcol")].map(c => c.scrollTop);
    el.innerHTML = "";
    const cols = document.createElement("div"); cols.className = "tcols";
    const col = (title, values, cur, pick) => {
      const w = document.createElement("div"); w.className = "tcolwrap";
      w.appendChild(label(title));
      const c = document.createElement("div"); c.className = "tcol";
      for (const v of values) {
        const b = mk("pd", pad(v)); if (v === cur) b.classList.add("sel");
        b.onclick = () => pick(v);
        c.appendChild(b);
      }
      w.appendChild(c);
      return w;
    };
    const hours = Array.from({ length: 24 }, (_, i) => i);
    const mins = [0, 10, 20, 30, 40, 50];
    cols.append(
      col("時", hours, hh, (v) => { hh = v; input.value = `${pad(hh)}:${pad(mm)}`; input.dispatchEvent(new Event("change")); draw(); }),
      col("分", mins, mm, (v) => { mm = v; commit(); })
    );
    el.appendChild(cols);
    const cs = el.querySelectorAll(".tcol");
    // 選んでいる時刻が見えるように、縦スクロールの位置をそろえる
    cs.forEach((c, i) => {
      const sel = c.querySelector(".sel");
      c.scrollTop = keep[i] !== undefined && keep[i] > 0 ? keep[i] : (sel ? sel.offsetTop - c.offsetTop - 2 * 34 : 0);
    });
  };
  document.body.appendChild(el);
  pickerEl = el;
  draw();
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  el.style.top = top + "px";
  el.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  const onDoc = (e) => { if (!el.contains(e.target) && !anchor.contains(e.target)) closePicker(); };
  let buf = "";
  const onKey = (e) => {
    if (e.key === "Escape") { closePicker(); anchor.focus(); return; }
    if (IME(e)) return;
    // 数字キーでも時刻を入力できる(例: 0930)
    if (/^\d$/.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      buf = buf.length >= 4 ? e.key : buf + e.key;
      hh = Math.min(23, +(buf.length >= 2 ? buf.slice(0, 2) : buf));
      mm = buf.length > 2 ? Math.min(59, +buf.slice(2).padEnd(2, "0")) : 0;
      input.value = `${pad(hh)}:${pad(mm)}`; input.dispatchEvent(new Event("change")); draw();
      return;
    }
    // Enter で時間を確定。Routine の入力欄なら、そのままカードも作る
    if (e.key === "Enter") {
      e.preventDefault();
      commit();
      if (input === $("rtime")) addTodo();
    }
  };
  document.addEventListener("mousedown", onDoc);
  document.addEventListener("keydown", onKey);
  window.addEventListener("resize", closePicker);
  // 時間の一覧を縦にスクロールしても閉じない(ポップアップの外のスクロールだけで閉じる)
  const onScroll = (e) => { if (!el.contains(e.target)) closePicker(); };
  window.addEventListener("scroll", onScroll, true);
  pickerOff = () => {
    document.removeEventListener("mousedown", onDoc);
    document.removeEventListener("keydown", onKey);
    window.removeEventListener("resize", closePicker);
    window.removeEventListener("scroll", onScroll, true);
  };
}

function setDue(v) {
  const el = $("due");
  el.value = v;
  if (el._sync) el._sync();
}

function linkLabel(href) {
  try {
    const u = new URL(href);
    return u.hostname.replace(/^www\./, "") + (u.pathname.length > 1 ? u.pathname.replace(/\/$/, "") : "");
  } catch (e) { return href; }
}

const GROUPS = [
  { key: "today", label: "Today" },
  { key: "week",  label: "Week" },
  { key: "later", label: "Later" },
  { key: "done",  label: "Done" },
];

// 完了 → done、期限切れと今日 → today、明日から今週の日曜まで(月曜始まり) → week、それ以外と日付なし → later
function groupOf(t) {
  if (t.done) return "done";
  if (t.routine) return t.waiting ? "later" : "today"; // ルーティーンは、時間になるまで Later
  const d = dueDate(t.due);
  if (!d) return "later";
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (d <= today) return "today";
  const weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate() + (7 - today.getDay()) % 7); // 今週の日曜(月曜始まり)
  return d <= weekEnd ? "week" : "later";
}

// 期限を過ぎた未完了タスクの日付を、今日の日付に書き換える
function rollOverdue() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const ts = todayStr();
  let changed = false;
  for (const t of todos) {
    const d = dueDate(t.due);
    if (!t.done && d && d < today) { t.due = ts; changed = true; }
  }
  return changed;
}

// hhmm("07:00") の、from より後で最初の時刻(ミリ秒)を返す
function nextOccurrence(hhmm, from) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(from);
  d.setHours(h, m, 0, 0);
  if (d.getTime() <= from) d.setDate(d.getDate() + 1);
  return d.getTime();
}

// ルーティーン: 設定の時間になったら、未完了に戻して Today に出す(完了済みなら Done から戻る)
function rollRoutines() {
  const now = Date.now();
  let changed = false;
  for (const t of todos) {
    if (!t.routine) continue;
    if (!t.nextAt) t.nextAt = nextOccurrence(t.routine, now);
    if (now >= t.nextAt) {
      t.waiting = false; t.done = false; delete t.doneAt;
      t.nextAt = nextOccurrence(t.routine, now);
      changed = true;
    }
  }
  return changed;
}

// 完了したタスクは、設定日付から1週間たったら自動で削除する(日付なしは完了した日から1週間)
function purgeDone() {
  const cutoff = new Date(); cutoff.setHours(0, 0, 0, 0); cutoff.setDate(cutoff.getDate() - 7);
  const before = todos.length;
  todos = todos.filter(t => {
    if (!t.done || t.routine) return true; // ルーティーンは消さない
    let base = dueDate(t.due);
    if (!base && t.doneAt) { base = new Date(t.doneAt); base.setHours(0, 0, 0, 0); }
    return !base || base > cutoff;
  });
  return todos.length !== before;
}

function makeItem(t) {
  const li = document.createElement("li");
  li.dataset.id = String(t.id);
  if (t.done) li.className = "done";

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = t.done;
  cb.setAttribute("aria-label", "完了にする");
  cb.onchange = () => {
    t.done = cb.checked;
    if (t.done) t.doneAt = Date.now(); else delete t.doneAt;
    save();
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!cb.checked || reduce) { render(); return; }
    // 完了したときは、すぐ消さずに少し余韻を残してから Done へ移す
    cb.disabled = true;
    li.classList.add("completing");
    setTimeout(() => {
      li.style.height = li.offsetHeight + "px";
      void li.offsetHeight;
      li.classList.add("leaving");
      setTimeout(render, 250);
    }, 400);
  };
  li.appendChild(cb);

  const body = document.createElement("div");
  body.className = "body";

  if (editingId === t.id) {
    const box = document.createElement("div");
    box.className = "editbox";
    const eText = document.createElement("textarea"); eText.rows = 1; eText.value = t.text; eText.addEventListener("input", () => autoGrow(eText)); eText.setAttribute("aria-label", "タスク");
    const eDue = document.createElement("input"); eDue.type = "date"; eDue.value = (t.due || "").slice(0, 10); eDue.setAttribute("aria-label", "日付");
    const eTime = document.createElement("input"); eTime.type = "text"; eTime.value = t.routine || ""; eTime.setAttribute("aria-label", "ルーティーンの時間");
    const eLink = document.createElement("input"); eLink.type = "text"; eLink.value = t.links.join(", "); eLink.placeholder = "https://example.com(,区切りで5つまで)"; eLink.setAttribute("aria-label", "リンク");
    const eLinkWrap = keepCaretAfterComma(eLink);
    const msg = document.createElement("div"); msg.style.cssText = "color:var(--danger);font-size:12px";
    const btns = document.createElement("div"); btns.className = "btns";
    const ng = document.createElement("button"); ng.type = "button"; ng.className = "ghost"; ng.textContent = "Close";
    li.classList.add("editing");
    let commitRef = null; // 編集中のチェックは「完了」ではなく「更新を確定」にする
    cb.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); if (commitRef) commitRef(true); });

    // 保存する。入力に問題があれば、メッセージを出して編集を続ける(false)
    const commit = (defer) => {
      const text = eText.value.trim();
      if (!text) { msg.textContent = "タスクを入力してください。"; return false; }
      const r = parseLinks(eLink.value);
      if (r.error) { msg.textContent = r.error; return false; }
      if (t.routine) {
        if (!/^\d{2}:\d{2}$/.test(eTime.value)) { msg.textContent = "ルーティーンの時間を入力してください。"; return false; }
        if (eTime.value !== t.routine) { t.routine = eTime.value; t.nextAt = nextOccurrence(t.routine, Date.now()); }
      } else {
        t.due = eDue.value;
      }
      t.text = text; t.links = r.links;
      editingId = null; editCommit = null; save();
      if (defer) { // クリックの動作が終わってから描き直す(押したボタンなどを壊さないため)
        const n = renderCount;
        setTimeout(() => { if (renderCount === n) render(); }, 0);
      } else render();
      return true;
    };
    const cancel = () => { editingId = null; render(); };
    editCommit = commit; commitRef = commit;
    ng.onclick = cancel;
    box.onkeydown = (e) => { if (e.target === eText && NL(e, eText)) return; if (e.key === "Enter" && !IME(e) && !(e.target === eText && (e.shiftKey || COARSE())) && (e.target.tagName !== "BUTTON" || e.target.classList.contains("dtext"))) { e.preventDefault(); closePicker(); commit(false); } if (e.key === "Escape") cancel(); };

    btns.append(ng);
    box.append(eText, t.routine ? timeField(eTime) : dateField(eDue), eLinkWrap, msg, btns);
    body.appendChild(box);
    setTimeout(() => { autoGrow(eText); eText.focus(); eText.setSelectionRange(eText.value.length, eText.value.length); }, 0);
  } else {
    const sp = document.createElement("div");
    sp.className = "t"; sp.textContent = t.text;
    body.appendChild(sp);
    if (t.hl) li.classList.add("hl");
    const hb = document.createElement("button"); hb.type = "button"; hb.className = "hlbtn"; hb.setAttribute("aria-label", "色をつける"); hb.title = "色をつける";
    hb.onclick = (e) => { e.stopPropagation(); if (t.hl) delete t.hl; else t.hl = true; save(); render(); };
    li.appendChild(hb);
    const gp = document.createElement("div"); gp.className = "grip"; gp.title = "ドラッグで並び替え"; gp.setAttribute("aria-label", "並び替え");
    gp.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 2h11M1.5 7h11M1.5 12h11" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>';
    li.appendChild(gp);
    // カードのどこかを1回クリックすると編集できる(チェック・リンク・矢印は除く)
    li.addEventListener("click", (e) => {
      if (editingId !== null || li.classList.contains("completing")) return;
      if (e.target.closest("a, button, input, .picker, .grip")) return;
      if (String(window.getSelection()).length) return; // 文字を選択しただけのとき
      editingId = t.id;
      render();
    });

    const showDue = t.due && groupOf(t) !== "today"; // Today では日付を出さない
    if (t.routine) {
      const d = document.createElement("span");
      d.className = "due";
      d.textContent = `毎日 ${t.routine}`;
      li.classList.add("hasdate");
      li.appendChild(d);
    } else if (showDue) {
      // 日付は、カードの左上の角に小さく控えめに置く
      const d = document.createElement("span");
      d.className = "due";
      d.append(fmtDue(t.due));
      const wd = document.createElement("span");
      wd.className = "wd";
      wd.textContent = weekdayOf(t.due);
      d.appendChild(wd);
      li.classList.add("hasdate");
      li.appendChild(d);
    }
    if (t.links.length) {
      const meta = document.createElement("div");
      meta.className = "meta";
      const mkLink = (href) => {
        const a = document.createElement("a");
        a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = linkLabel(href); a.title = href;
        return a;
      };
      // 1つ目のリンクをそのまま表示し、2つ目以降は矢印で開く蛇腹にする
      const row = document.createElement("div");
      row.className = "lrow";
      row.appendChild(mkLink(t.links[0]));
      meta.appendChild(row);
      const rest = t.links.slice(1);
      if (rest.length) {
        const isOpen = openLinks.has(t.id);
        const head = document.createElement("button");
        head.type = "button"; head.className = "acc";
        head.setAttribute("aria-expanded", String(isOpen));
        head.setAttribute("aria-label", `ほかのリンク${rest.length}件を開閉`);
        const chev = document.createElement("span"); chev.className = "chev";
        head.append(`+${rest.length}`, chev);
        row.appendChild(head);
        const box = document.createElement("div"); box.className = "links" + (isOpen ? " open" : "");
        const inner = document.createElement("div");
        for (const href of rest) inner.appendChild(mkLink(href));
        box.appendChild(inner);
        head.onclick = () => {
          const o = box.classList.toggle("open");

}

// ---- 日本の祝日(計算で求める。振替休日・国民の休日も含む) ----
const holCache = {};
function jpHolidays(y) {
  if (holCache[y]) return holCache[y];
  const map = {};
  const pad = (n) => String(n).padStart(2, "0");
  const key = (m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const add = (m, d, name) => { map[key(m, d)] = name; };
  const nthMon = (m, n) => { const first = new Date(y, m - 1, 1).getDay(); return 1 + ((8 - first) % 7) + (n - 1) * 7; };
  const eq = (base) => Math.floor(base + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  if (y >= 1949) add(1, 1, "元日");
  if (y >= 2000) add(1, nthMon(1, 2), "成人の日");
  if (y >= 2020) add(2, 11, "建国記念の日");
  if (y >= 2020) add(2, 23, "天皇誕生日");
  add(3, eq(20.8431), "春分の日");
  if (y >= 2007) add(4, 29, "昭和の日");
  add(5, 3, "憲法記念日");
  if (y >= 2007) add(5, 4, "みどりの日");
  add(5, 5, "こどもの日");
  if (y === 2020) { add(7, 23, "海の日"); add(7, 24, "スポーツの日"); add(8, 10, "山の日"); }
  else if (y === 2021) { add(7, 22, "海の日"); add(7, 23, "スポーツの日"); add(8, 8, "山の日"); }
  else {
    add(7, nthMon(7, 3), "海の日");
    if (y >= 2016) add(8, 11, "山の日");
    add(10, nthMon(10, 2), y >= 2020 ? "スポーツの日" : "体育の日");
  }
  add(9, nthMon(9, 3), "敬老の日");
  add(9, eq(23.2488), "秋分の日");
  add(11, 3, "文化の日");
  add(11, 23, "勤労感謝の日");
  // 国民の休日: 前後が祝日にはさまれた平日(9月)
  for (let d = 1; d <= 30; d++) {
    const dt = new Date(y, 8, d);
    if (map[key(9, d)] || dt.getDay() === 0 || dt.getDay() === 1) continue;
    if (map[key(9, d - 1)] && map[key(9, d + 1)]) map[key(9, d)] = "国民の休日";
  }
  // 振替休日: 日曜の祝日は、次の祝日でない日が休み
  for (const k of Object.keys(map).sort()) {
    const dt = new Date(k + "T00:00:00");
    if (dt.getDay() !== 0 || map[k] === "振替休日") continue;
    const n = new Date(dt);
    do { n.setDate(n.getDate() + 1); } while (map[ymdOf(n)]);
    if (n.getFullYear() === y) map[ymdOf(n)] = "振替休日";
  }
  return (holCache[y] = map);
}

function renderCal() {
  const el = $("calview");
  el.innerHTML = "";
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const chipFor = (t, label) => {
    const b = mk("button", "chip" + (t.done ? " done" : "") + (t.hl ? " hl" : ""), label || t.text);
    b.type = "button";
    b.title = t.text;
    b.onclick = () => openFromCal(t);
    return b;
  };

  // 月の切り替え
  const head = mk("div", "chead");
  const prev = mk("button", "", "‹"); prev.type = "button"; prev.setAttribute("aria-label", "前の月");
  const next = mk("button", "", "›"); next.type = "button"; next.setAttribute("aria-label", "次の月");
  prev.onclick = () => { calOpenKey = null; calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCal(); };
  next.onclick = () => { calOpenKey = null; calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCal(); };
  head.append(prev, mk("span", "ctitle", `${calMonth.getFullYear()}.${calMonth.getMonth() + 1}`), next);
  el.appendChild(head);
  // 今月にもどるボタン(見出しの下)
  const trow = mk("div", "ctrow");
  const today = mk("button", "ctoday", "Today"); today.type = "button";
  today.onclick = () => { calOpenKey = null; const d = new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); renderCal(); };
  trow.appendChild(today);
  el.appendChild(trow);

  // 曜日(月曜はじまり)
  const wd = mk("div", "cwd");
  const todayCol = (new Date().getDay() + 6) % 7;
  [..."月火水木金土日"].forEach((c, i) => wd.appendChild(mk("span", i === todayCol ? "now" : "", c)));
  el.appendChild(wd);

  // 日付ごとのタスク
  const byDate = {};
  for (const t of todos) {
    if (t.routine) continue;
    const d = dueDate(t.due);
    if (!d) continue;
    (byDate[ymdOf(d)] = byDate[ymdOf(d)] || []).push(t);
  }
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7; // 月曜からの何日目か
  const days = new Date(y, m + 1, 0).getDate();
  const weeks = Math.ceil((lead + days) / 7);
  const todayKey = todayStr();
  const grid = mk("div", "cgrid");
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(y, m, 1 - lead + i);
    const key = ymdOf(d);
    const cell = mk("div", "cc" + (d.getMonth() !== m ? " out" : "") + (key === todayKey ? " today" : "") + (i >= (weeks - 1) * 7 ? " lastrow" : ""));
    const ci = mk("div", "ci");
    const hol = jpHolidays(d.getFullYear())[key];
    const nrow = mk("div", "cnrow");
    nrow.appendChild(mk("span", "cn", String(d.getDate())));
    if (hol) { cell.classList.add("hol"); cell.title = hol; nrow.appendChild(mk("span", "hn", hol)); }
    ci.appendChild(nrow);
    const list = (byDate[key] || []).slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
    const LIM = matchMedia("(max-width:700px)").matches ? 3 : 2; // iPhone は3件まで、Mac は2件まで
    const open = calOpenKey === key && list.length > LIM;
    if (open) cell.classList.add("open");
    // 高さは固定。3件以上の日は、2件+「他N件」にして、押すと全部を広げる
    for (const t of (list.length > LIM && !open ? list.slice(0, LIM) : list)) ci.appendChild(chipFor(t));
    if (list.length > LIM) {
      const more = mk("button", "more", open ? "Close ▴" : "etc ▾");
      more.type = "button";
      more.setAttribute("aria-expanded", String(open));
      more.onclick = (e) => { e.stopPropagation(); calOpenKey = open ? null : key; renderCal(); };
      ci.appendChild(more);
    }
    cell.appendChild(ci);
    cell.addEventListener("click", (e) => { if (e.target.closest(".chip,.more")) return; openDayAdd(key); });
    grid.appendChild(cell);
  }
  el.appendChild(grid);

  // Routine(毎日くり返すもの)は、日付に置かずに1行にまとめて、カレンダーの下に置く
  const routines = todos.filter(t => t.routine).sort((a, b) => a.routine.localeCompare(b.routine));
  if (routines.length) {
    const strip = mk("div", "cstrip");
    strip.appendChild(mk("span", "", "Routine"));
    for (const t of routines) strip.appendChild(chipFor(t, `${t.routine} ${t.text}`));
    el.appendChild(strip);
  }

  // カレンダーの下には Routine だけを出す(日付なしのタスクは出さない)
}

function openDayAdd(key) {
  if (document.querySelector(".dm")) return;
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const m = mk("div", "dm"); const box = mk("div", "box");
  const d = new Date(key + "T00:00:00");

  const ta = document.createElement("textarea"); ta.rows = 1; ta.setAttribute("aria-label", "タスク");
  ta.addEventListener("input", () => autoGrow(ta));
  const close = () => m.remove();
  const add = () => {
    const text = ta.value.trim(); if (!text) { close(); return; }
    todos.push({ id: Date.now() + Math.random(), text, done: false, due: key, links: [] });
    save(); close(); render();
  };
  m.onclick = (e) => { if (e.target === m) add(); }; // 外側を押すと、入力があれば追加して閉じる
  ta.onkeydown = (e) => {
    if (NL(e, ta)) return;
    if (e.key === "Escape") close();
    if (e.key === "Enter" && !IME(e) && !e.shiftKey && !COARSE()) { e.preventDefault(); add(); }

}

function render() {
  closePicker();
  renderCount++;
  editCommit = null;
  const rolled = rollRoutines() | rollOverdue() | purgeDone();
  if (rolled) save();
  const root = $("list");
  root.innerHTML = "";
  // 4つのグループを全部つくる。幅がせまいときは、選んだ1つだけを見せる(CSS で切り替え)
  for (const g of GROUPS) {
    const items = todos.filter(t => groupOf(t) === g.key);
    // 日付の早い順(日付なしは最後)。同じ日付は追加した順(新しいものが下)。
    // Routine のカードは一番上(時間の早い順)
    const byDateOnly = g.key === "week" || g.key === "later"; // Week・Later は、日付順 → 追加順(古いものが上)
    items.sort((a, b) => {
      if (byDateOnly) {
        if (a.routine || b.routine) { if (!a.routine) return 1; if (!b.routine) return -1; return a.routine.localeCompare(b.routine); }
        const da = dueDate(a.due), db = dueDate(b.due);
        if (da && db && da - db) return da - db;
        if (!da !== !db) return da ? -1 : 1;
        return a.id - b.id;
      }
      // 並び替えた順(ord)があれば、それを最優先。まだ並び替えていない新しいカードは、その後ろ
      if (a.ord != null || b.ord != null) { if (a.ord == null) return 1; if (b.ord == null) return -1; return a.ord - b.ord; }
      if (a.routine || b.routine) { if (!a.routine) return 1; if (!b.routine) return -1; return a.routine.localeCompare(b.routine); }
      const da = dueDate(a.due), db = dueDate(b.due);
      if (da && db) return da - db;
      return da ? -1 : db ? 1 : 0;
    });

    const sec = document.createElement("section");
    sec.dataset.g = g.key;
    if (g.key === current) sec.classList.add("cur");
    const h = document.createElement("h2");
    h.textContent = g.label;
    const n = document.createElement("span");
    n.textContent = items.length + "件";
    h.appendChild(n);
    sec.appendChild(h);

    if (items.length) {
      const ul = document.createElement("ul");
      for (const t of items) ul.appendChild(makeItem(t));
      sec.appendChild(ul);
    }
    root.appendChild(sec);
  }

  for (const b of document.querySelectorAll(".bar button")) b.setAttribute("aria-pressed", b.dataset.g === current);
  if (view === "cal") renderCal();
}

function addTodo(keepBlur) {

// ---- カードのドラッグ&ドロップで並び替え(同じグループの中) ----
// マウスは少し動かすと、タッチは長押しすると、つかめる。
let drag = null, dragClickBlock = false;
$("list").addEventListener("pointerdown", (e) => {
  if (drag || view === "cal" || (e.pointerType === "mouse" && e.button !== 0)) return;
  const li = e.target.closest("li");
  if (!li || li.classList.contains("editing") || li.classList.contains("completing")) return;
  if (!e.target.closest(".grip")) return; // 三本線のところだけで並び替え(本文は選択・コピーできる)
  const ul = li.parentNode;
  if (ul.children.length < 2) return;
  if (!["today", "done"].includes(li.closest("section").dataset.g)) return; // Week・Later は日付順で固定
  const d = drag = { li, ul, id: e.pointerId, x: e.clientX, y: e.clientY, grab: 0, on: false, timer: 0, touch: e.pointerType !== "mouse" };
  e.preventDefault();

});
function start(d) {

  let next;
  while ((next = li.nextElementSibling) && y > next.getBoundingClientRect().top + next.offsetHeight / 2) d.ul.insertBefore(next, li);
  li.style.transform = `translateY(${y - d.grab - li.getBoundingClientRect().top}px)`;
}
document.addEventListener("pointermove", (e) => {
  const d = drag;

    const dist = Math.hypot(e.clientX - d.x, e.clientY - d.y);
    if (d.touch) { if (dist > 8) { clearTimeout(d.timer); drag = null; } return; } // 指が動いたらスクロール

document.addEventListener("selectstart", (e) => { if (drag && drag.on) e.preventDefault(); });
function endDrag(e, cancel) {

  [...d.ul.children].forEach((el, i) => {

document.addEventListener("pointerup", (e) => endDrag(e, false));
document.addEventListener("pointercancel", (e) => endDrag(e, true));

// リンクを長押し(約0.6秒、動かさない)すると、URLをコピーする(押した指を離しても、リンクは開かない)
{

    pressT = 0;
    // 標準のリンク遷移は常に止め、長押しでないときだけ自前で開く
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    if (!longPress) window.open(a.href, "_blank", "noopener,noreferrer");
  }, true);
  document.addEventListener("contextmenu", (e) => { if (e.pointerType === "touch" && e.target.closest && e.target.closest("#list a")) e.preventDefault(); });
}

// カードを長押し(約0.7秒、動かさない)すると、削除の確認を出す
{
  let lp = null;
  const clear = () => { if (lp) { clearTimeout(lp.timer); lp = null; } };
  $("list").addEventListener("pointerdown", (e) => {
    clear();
    if (view === "cal" || (e.pointerType === "mouse" && e.button !== 0)) return;
    const li = e.target.closest("li");
    if (!li || li.classList.contains("editing") || li.classList.contains("completing")) return;
    if (e.target.closest("a, button, input, textarea, .picker, .grip")) return;
    const d = lp = { id: e.pointerId, x: e.clientX, y: e.clientY, li };
    d.timer = setTimeout(() => {
      lp = null;
      if (drag) { const dd = drag; clearTimeout(dd.timer); drag = null; document.body.classList.remove("dragging"); dd.li.classList.remove("dragging"); dd.li.style.transform = ""; render(); }
      dragClickBlock = true; setTimeout(() => { dragClickBlock = false; }, 400);
      const sel = window.getSelection && window.getSelection(); if (sel) sel.removeAllRanges();
      confirmDelete(li.dataset.id);
    }, 700);
  });
  document.addEventListener("pointermove", (e) => {
    if (lp && e.pointerId === lp.id && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 8) clear();
  });
  document.addEventListener("pointerup", clear);
  document.addEventListener("pointercancel", clear);
  $("list").addEventListener("contextmenu", (e) => { if (e.pointerType === "touch") e.preventDefault(); });
}
function confirmDelete(id) {
  const t = todos.find(x => String(x.id) === String(id));
  if (!t || document.querySelector(".dm")) return;
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const m = mk("div", "dm"), box = mk("div", "box"), row = mk("div", "row");
  const cl = mk("button", "ghost", "Close"); cl.type = "button";
  const del = mk("button", "danger", "Delete"); del.type = "button";
  const close = () => m.remove();
  cl.onclick = close; m.onclick = (e) => { if (e.target === m) close(); };
  del.onclick = () => { todos = todos.filter(x => String(x.id) !== String(id)); save(); close(); render(); };
  m.onkeydown = (e) => { if (e.key === "Escape") close(); else if (e.key === "Enter" && !IME(e)) { e.preventDefault(); del.click(); } };
  row.append(cl, del);
  box.append(mk("div", "q", "Delete?"), mk("div", "qt", t.text), row);
  m.appendChild(box); m.classList.add("near"); document.body.appendChild(m); del.focus();
  const cur = [...document.querySelectorAll("#list li")].find(x => x.dataset.id === String(id));
  if (cur) {
    const r = cur.getBoundingClientRect(), bh = box.offsetHeight, bw = box.offsetWidth;
    const left = Math.max(12, Math.min(r.left + r.width / 2 - bw / 2, innerWidth - bw - 12));
    let top = r.bottom + 6;
    if (top + bh > innerHeight - 8) top = Math.max(8, r.top - bh - 6);
    box.style.left = left + "px"; box.style.top = top + "px";
  } else { m.classList.remove("near"); }
}

// カードやボタンのない背景をクリックしたら、本文の入力欄にカーソルを移す(文字を選択しているときは除く)
document.addEventListener("click", (e) => {
  if (view === "cal") return;
  if (e.target.closest("li, #form, .bar, .picker, a, button, input, textarea, select, label")) return;
  const sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed) return;
  $("input").focus();
});

// どこにカーソルがあっても、文字を打ち始めたら本文の入力欄に入れる(日本語入力の1文字目も含む)
document.addEventListener("keydown", (e) => {
  if (view === "cal") {
    if (e.key === "Escape") { if (calOpenKey) { calOpenKey = null; renderCal(); } else setView("list"); }
    return;
  }
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || IME(e)) return;
  const t = e.target;
  if (t.closest && t.closest("input, textarea, select, [contenteditable], li.editing, .picker")) return;
  if (document.querySelector("li.editing, .picker")) return;
  const printable = e.key.length === 1 || e.key === "Process" || e.keyCode === 229;
  if (!printable) return;
  if (e.key === " " && t.closest && t.closest("button")) return; // ボタンのスペース操作は残す
  $("input").focus();
});

// 編集中のカードの外をクリックしたら保存する。カードの中で押し始めたドラッグは除く。
let downInside = false;
document.addEventListener("mousedown", (e) => { downInside = !!e.target.closest("li.editing, .picker"); }, true);
document.addEventListener("click", (e) => {
  if (editingId === null || downInside || !editCommit) return;
  if (e.target.closest("li.editing, .picker")) return;
  editCommit(true);
}, true);

// 下のバー: 押したグループだけを表示する
document.querySelector(".bar").onclick = (e) => {
  const b = e.target.closest("button[data-g]");
  if (!b) return;
  if (editingId !== null) return; // 入力に問題があって編集が続いているときは移らない
  current = b.dataset.g;
  render();
};

// 横スワイプ: 一覧ではグループ(指に合わせて引っ張るように動く)、カレンダーでは月を切り替える
{
  let sx = 0, sy = 0, st = 0, ok = false, axis = "", busy = false, vw = 390;
  const isCal = () => document.body.classList.contains("cal");
  const list = () => document.getElementById(isCal() ? "calview" : "list");
  const narrowList = () => isCal() || matchMedia("(max-width:640px)").matches;
  const neighbor = (dir) => { if (isCal()) return 1; const i = GROUPS.findIndex(g => g.key === current) + dir; return i < 0 || i >= GROUPS.length ? -1 : i; };
  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); axis = ""; if (!busy) vw = window.innerWidth;
    ok = !busy && e.touches.length === 1 && !document.querySelector(".dm") && editingId === null && !(e.target.closest && e.target.closest("input,textarea,.popup,.picker,.grip"));
  }, { passive: true });
  // 隣のグループを、指の動きに合わせて横から見せる(カレンダー以外)
  let peekEl = null, peekDir = 0;
  const peekOff = () => { if (peekEl) { peekEl.style.cssText = ""; peekEl = null; } peekDir = 0; const L = list(); if (L && !isCal()) { L.style.position = ""; document.querySelector("main").style.overflowX = ""; } };
  const peekOn = (dir) => {
    peekOff();
    if (isCal()) return;
    const i = neighbor(dir); if (i < 0) return;
    const sec = document.querySelector('#list > section[data-g="' + GROUPS[i].key + '"]'); if (!sec) return;
    const L = list(); L.style.position = "relative"; document.querySelector("main").style.overflowX = "clip";
    sec.style.cssText = "display:block;position:absolute;top:0;left:" + (dir * 100) + "%;width:100%;box-sizing:border-box";
    peekEl = sec; peekDir = dir;
  };
  document.addEventListener("touchmove", (e) => {
    if (!ok || drag || !narrowList()) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (!axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? "x" : "y";
    }
    if (axis !== "x") return;
    if (e.cancelable) e.preventDefault();
    const L = list(); if (!L) return;
    const dir = dx < 0 ? 1 : -1;
    if (peekDir !== dir) peekOn(dir);
    const tx = neighbor(dir) < 0 ? dx * 0.25 : dx; // 端では重くなる
    L.style.transition = "none";
    L.style.transform = `translateX(${tx}px)`;
    if (isCal()) L.style.opacity = String(1 - Math.min(Math.abs(tx) / 500, 0.35));
  }, { passive: false });
  document.addEventListener("touchend", (e) => {
    if (!ok || drag) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (!narrowList() || axis !== "x") return;
    const L = list(); if (!L) return;
    const dir = dx < 0 ? 1 : -1, i = neighbor(dir), w = vw;
    const fast = Date.now() - st < 300 && Math.abs(dx) > 30;
    if (i < 0 || !(Math.abs(dx) > w * 0.25 || fast)) { // 戻る
      L.style.transition = "transform .22s ease, opacity .22s ease";
      L.style.transform = ""; L.style.opacity = "";
      setTimeout(() => { peekOff(); L.style.transition = ""; }, 240);
      return;
    }
    busy = true;
    if (!isCal()) { // 隣のグループがそのまま横から入ってくる
      L.style.transition = "transform .2s ease-out";
      L.style.transform = `translateX(${-dir * w}px)`;
      setTimeout(() => {
        L.style.transition = "none"; L.style.transform = "";
        peekOff();
        current = GROUPS[i].key; render();
        void L.offsetWidth; L.style.transition = ""; busy = false;
      }, 210);
      return;
    }
    L.style.transition = "transform .16s ease-in, opacity .16s ease-in";
    L.style.transform = `translateX(${-dir * w}px)`; L.style.opacity = "0.3";
    setTimeout(() => {
      calOpenKey = null; calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + dir, 1); renderCal();
      L.style.transition = "none";
      L.style.transform = `translateX(${dir * w * 0.6}px)`; L.style.opacity = "0.3";
      void L.offsetWidth;
      L.style.transition = "transform .24s cubic-bezier(.2,.8,.2,1), opacity .24s ease";
      L.style.transform = ""; L.style.opacity = "";
      setTimeout(() => { L.style.transition = ""; busy = false; }, 260);
    }, 160);
  }, { passive: true });
  document.addEventListener("touchcancel", () => { const L = list(); if (L && axis === "x") { L.style.transition = "transform .2s ease"; L.style.transform = ""; L.style.opacity = ""; setTimeout(peekOff, 220); } }, { passive: true });
}

// 開いたまま日付が変わったとき、タブに戻ったときに表示を更新する
let lastDay = todayStr();
function checkDayChange() {
  if (editingId !== null) return; // 編集中は次回に回す
  const now = todayStr();
  const dayChanged = now !== lastDay;
  const routineDue = todos.some(t => t.routine && t.nextAt && Date.now() >= t.nextAt);
  if (!dayChanged && !routineDue) return;
  if (dayChanged && $("due").value === lastDay) setDue(now);
  lastDay = now;
  render();
}
setInterval(checkDayChange, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDayChange(); });
window.addEventListener("focus", checkDayChange);

dateField($("due"));
timeField($("rtime"));
$("viewbtn").onclick = () => setView(view === "cal" ? "list" : "cal");
setDue(todayStr());
render();
</script>
</body>
